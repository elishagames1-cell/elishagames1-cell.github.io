<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elisha Games</title>
<meta name="description" content="Elisha Games — play free browser games: racing, soccer, arcade and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1016;--bg-2:#141722;--surface:#181c27;--surface-2:#1f2431;--line:#262c3a;
    --text:#eef0f6;--muted:#8f95a8;--accent:#4f8cff;--accent-2:#7c5cff;--green:#2fd38a;--gold:#ffc64b;
    --r:16px;--shadow:0 20px 50px -20px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  button{font:inherit;color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  /* nav */
  .nav{position:sticky;top:0;z-index:20;background:rgba(14,16,22,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .nav .wrap{display:flex;align-items:center;gap:22px;height:66px}
  .brand{display:flex;align-items:center;gap:11px;font-family:Sora,Inter,sans-serif;font-weight:800;font-size:19px;letter-spacing:.5px;text-transform:uppercase}
  .brand .mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 18px -6px var(--accent)}
  .brand .mark svg{width:20px;height:20px;fill:#fff}
  .links{display:flex;gap:4px;margin-left:8px}
  .links a{padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:500;font-size:14.5px;transition:.15s}
  .links a:hover,.links a.active{color:var(--text);background:var(--surface-2)}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:40px;width:min(300px,100%);transition:border-color .15s}
  .search:focus-within{border-color:var(--accent)}
  .search svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;flex:none}
  .search input{background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:14px;width:100%}
  .search input::placeholder{color:var(--muted)}

  /* hero */
  .hero{margin:28px auto 0}
  .feature{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);min-height:430px;display:flex;align-items:flex-end;box-shadow:var(--shadow);isolation:isolate}
  .feature .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.02);transition:transform .9s ease;z-index:-2}
  .feature:hover .bg{transform:scale(1.06)}
  .feature::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(14,16,22,.96) 0%,rgba(14,16,22,.78) 38%,rgba(14,16,22,.15) 72%,rgba(14,16,22,0) 100%),linear-gradient(0deg,rgba(14,16,22,.9) 0%,rgba(14,16,22,0) 55%)}
  .feature .body{padding:40px;max-width:560px;display:flex;flex-direction:column;gap:14px}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold)}
  .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
  .feature h1{margin:0;font-family:Sora,Inter,sans-serif;font-size:clamp(38px,6vw,64px);font-weight:800;line-height:1;letter-spacing:-1px}
  .feature p{margin:0;color:#c3c8d6;font-size:16.5px;max-width:48ch}
  .meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
  .meta b{color:var(--text);font-weight:600}
  .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid transparent;cursor:pointer;transition:.15s}
  .btn svg{width:16px;height:16px;fill:currentColor}
  .btn.primary{background:var(--accent);color:#fff;box-shadow:0 10px 24px -10px var(--accent)}
  .btn.primary:hover{background:#6a9dff;transform:translateY(-1px)}
  .btn.ghost{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
  .btn.ghost:hover{background:rgba(255,255,255,.12)}

  /* section */
  .section{margin-top:54px}
  .sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .sec-head h2{margin:0;font-family:Sora,Inter,sans-serif;font-size:26px;font-weight:700;letter-spacing:-.3px}
  .sec-head h2 span{color:var(--muted);font-weight:600;font-size:16px;margin-left:8px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
  .chip:hover{color:var(--text)}
  .chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
  .card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:transform .25s ease,border-color .25s,box-shadow .25s;animation:rise .5s ease backwards}
  .card:hover{transform:translateY(-6px);border-color:#3a4256;box-shadow:var(--shadow)}
  .thumb{position:relative;aspect-ratio:2.15/1;overflow:hidden;background:var(--surface-2)}
  .thumb img,.thumb .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
  .card:hover .thumb img,.card:hover .thumb .cover{transform:scale(1.06)}
  .thumb .cover{display:grid;place-items:center;font-size:64px}
  .thumb .cover b{position:absolute;left:14px;bottom:10px;font-family:Sora,Inter,sans-serif;font-size:18px;letter-spacing:2px;text-transform:uppercase;opacity:.9}
  .thumb .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(14,16,22,.45);opacity:0;transition:opacity .25s}
  .card:hover .thumb .play{opacity:1}
  .thumb .play span{width:58px;height:58px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 10px 30px -8px var(--accent);transform:scale(.8);transition:transform .25s}
  .card:hover .thumb .play span{transform:scale(1)}
  .thumb .play svg{width:22px;height:22px;fill:#fff;margin-left:3px}
  .badge{position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:var(--gold);color:#1a1300}
  .cbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
  .cbody .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .cbody h3{margin:0;font-family:Sora,Inter,sans-serif;font-size:18px;font-weight:700}
  .genre{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
  .cbody p{margin:0;color:var(--muted);font-size:14px;flex:1}
  .cfoot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--muted)}
  .cfoot .go{color:var(--text);font-weight:700;display:inline-flex;align-items:center;gap:6px}
  .cfoot .go svg{width:14px;height:14px;fill:currentColor;transition:transform .2s}
  .card:hover .cfoot .go svg{transform:translateX(3px)}
  .empty{display:none;text-align:center;color:var(--muted);padding:50px 0}

  /* about */
  .about{margin-top:64px;padding:34px;border-radius:22px;background:linear-gradient(135deg,var(--surface),var(--bg-2));border:1px solid var(--line);display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center}
  .about h2{margin:0 0 8px;font-family:Sora,Inter,sans-serif;font-size:24px}
  .about p{margin:0;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
  .stat b{display:block;font-family:Sora,Inter,sans-serif;font-size:28px;color:var(--text)}
  .stat span{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}

  footer{margin-top:70px;border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:13.5px}
  footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

  @keyframes rise{from{opacity:0;transform:translateY(16px)}}
  @media (max-width:800px){
    .links{display:none}
    .feature{min-height:360px}
    .feature .body{padding:26px}
    .about{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</nav>

/* ===== Add a new game here =====
   slug  : short id (used in the link)
   name  : title shown on the site
   genre : Racing / Sports / Arcade ...
   desc  : one line
   url   : where the game lives
   img   : a key from THUMBS, or a full image URL, or null for a generated cover
   cover : {bg, icon} used only when img is null
   badge : "New" etc. or ""
   featured : true for the big banner */
const GAMES = [
  { slug:'car-race', name:'Car Race', genre:'Racing', desc:'Race against the clock through coast, forest, desert and city. Checkpoints add time, overtakes fill your nitro, and day turns to night.',
    url:'https://elishagames1-cell.github.io/car-race/', img:'car', hero:'carHero', badge:'New', featured:true },
  { slug:'super-goal-3d', name:'Super Goal 3D', genre:'Sports', desc:'Fast 5-a-side soccer in full 3D. Pick your difficulty and match length, then shoot for glory.',
    url:'https://elishagames1-cell.github.io/kadur-totach/', img:'https://elishagames1-cell.github.io/kadur-totach/cover.png', badge:'' },
  { slug:'fifa-soccer', name:'FIFA Style Soccer', genre:'Sports', desc:'Full 11-v-11 soccer with teams, tactics, a leaderboard and a power-shot meter.',
    url:'https://elishagames1-cell.github.io/fifa-style-soccer/', img:null, cover:{bg:'linear-gradient(135deg,#0b3d1f,#1f9d55)',icon:'⚽'}, badge:'' },
  { slug:'flappy-bird', name:'Flappy Bird', genre:'Arcade', desc:'Tap to fly between the pipes. Simple to learn, impossible to put down.',
    url:'https://elishagames1-cell.github.io/flappy-bird/', img:'flappy', badge:'' },
];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const src=g=>g.img?(THUMBS[g.img]||g.img):null;
const playUrl=g=>'play.html?g='+encodeURIComponent(g.slug);
const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ARROW='<svg viewBox="0 0 24 24"><path d="M5 11h11.2l-4.6-4.6L13 5l7 7-7 7-1.4-1.4 4.6-4.6H5z"/></svg>';

function thumbHTML(g){
  if(src(g))return `<img src="${esc(src(g))}" alt="${esc(g.name)}" loading="lazy">`;
  return `<div class="cover" style="background:${g.cover.bg}">${g.cover.icon}<b>${esc(g.name)}</b></div>`;
}
function renderHero(){
  const g=GAMES.find(x=>x.featured)||GAMES[0];
  $('#hero').innerHTML=`
    <a class="feature" href="${playUrl(g)}">
      <div class="bg" style="background-image:url('${(g.hero&&THUMBS[g.hero])||src(g)||''}');${src(g)?'':'background:'+g.cover.bg}"></div>
      <div class="body">
        <span class="tag">Featured</span>
        <h1>${esc(g.name)}</h1>
        <p>${esc(g.desc)}</p>
        <div class="meta"><span>Genre <b>${esc(g.genre)}</b></span><span>Platform <b>Browser</b></span><span>Price <b>Free</b></span></div>
        <div class="cta"><span class="btn primary">${PLAY} Play now</span><span class="btn ghost">Details</span></div>
      </div>
    </a>`;
}
let genre='All';
function renderChips(){
  const gs=['All',...new Set(GAMES.map(g=>g.genre))];
  $('#chips').innerHTML=gs.map(x=>`<button class="chip${x===genre?' on':''}" data-g="${esc(x)}">${esc(x)}</button>`).join('');
}
function renderGrid(){
  const q=$('#q').value.trim().toLowerCase();
  const list=GAMES.filter(g=>(genre==='All'||g.genre===genre)&&(!q||(g.name+' '+g.genre+' '+g.desc).toLowerCase().includes(q)));
  $('#grid').innerHTML=list.map((g,i)=>`
    <a class="card" href="${playUrl(g)}" style="animation-delay:${i*60}ms">
      <div class="thumb">${thumbHTML(g)}${g.badge?`<span class="badge">${esc(g.badge)}</span>`:''}<div class="play"><span>${PLAY}</span></div></div>
      <div class="cbody">
        <div class="top"><h3>${esc(g.name)}</h3><span class="genre">${esc(g.genre)}</span></div>
        <p>${esc(g.desc)}</p>
        <div class="cfoot"><span>Free · Browser</span><span class="go">Play ${ARROW}</span></div>
      </div>
    </a>`).join('');
  $('#empty').style.display=list.length?'none':'block';
  $('#count').textContent='('+GAMES.length+')';
  $('#sGames').textContent=GAMES.length;
}
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;genre=b.dataset.g;renderChips();renderGrid();});
$('#q').addEventListener('input',renderGrid);
renderHero();renderChips();renderGrid();
</script>
</body>
</html>
